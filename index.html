<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치/홈 인디케이터 영역(safe-area)까지 사용하고 CSS env()로 여백을 준다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4168F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Soulrip — Seoul solo travel guide: places, festivals, community and AI chat in 7 languages."
    />
    <title>Soulrip</title>
    <script>
      // 첫 페인트 전에 저장된 테마(없으면 OS 설정)를 적용해 화면 깜빡임을 막는다.
      try {
        var saved = localStorage.getItem('soulrip-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
